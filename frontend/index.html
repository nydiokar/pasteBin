<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paste Server</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body data-theme="light">
    <!-- Login Screen -->
    <div id="login-screen" class="login-container">
        <div class="login-box">
            <h1>🔒 Paste Server</h1>
            <form id="login-form">
                <input type="password" id="password-input" placeholder="Enter password" autocomplete="current-password" required>
                <button type="submit">Login</button>
                <p id="login-error" class="error hidden"></p>
            </form>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="hidden">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="top-bar-left">
                <button id="sidebar-toggle" class="icon-btn mobile-only">☰</button>
                <h1>Paste Dumps</h1>
            </div>
            <div class="top-bar-right">
                <button id="new-paste-btn" class="primary-btn">+ New Dump</button>
                <button id="refresh-btn" class="icon-btn" title="Refresh pastes">🔄</button>
                <button id="theme-toggle" class="icon-btn" title="Toggle dark mode">🌙</button>
                <button id="logout-btn" class="icon-btn" title="Logout">🔒</button>
            </div>
        </header>

        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Sidebar -->
            <aside id="sidebar" class="sidebar">
                <div class="sidebar-search">
                    <input type="text" id="search-input" placeholder="Search pastes...">
                </div>
                <div id="sidebar-content" class="sidebar-content">
                    <div class="loading">Loading pastes...</div>
                </div>
            </aside>

            <!-- Main Area -->
            <main class="main-area">
                <div id="main-content" class="main-content">
                    <div class="empty-state">
                        <p>No pastes yet. Click "+ New Dump" to create one.</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- New Paste Modal -->
    <div id="new-paste-modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>New Dump</h2>
                <button class="modal-close">✕</button>
            </div>

            <!-- Tab bar -->
            <div class="modal-tabs">
                <button class="modal-tab active" data-tab="text">Text</button>
                <button class="modal-tab" data-tab="file">File</button>
            </div>

            <div class="modal-body">
                <!-- Text panel -->
                <div id="tab-panel-text" class="tab-panel">
                    <textarea id="new-paste-textarea" placeholder="Paste your text here..."></textarea>
                </div>

                <!-- File panel -->
                <div id="tab-panel-file" class="tab-panel hidden">
                    <label class="file-drop-zone" id="file-drop-zone" for="file-input">
                        <span class="file-drop-icon">📁</span>
                        <p>Tap to browse or drop a file here</p>
                        <p class="file-drop-hint">Images, PDFs, archives and more · Max 25 MB</p>
                    </label>
                    <input type="file" id="file-input" class="file-input-hidden">
                    <div class="file-selected-info hidden" id="file-selected-info">
                        <span class="file-selected-name" id="file-selected-name"></span>
                        <button class="file-remove-btn" id="file-remove-btn">✕</button>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button id="cancel-paste-btn" class="secondary-btn">Cancel</button>
                <button id="save-paste-btn" class="primary-btn">Save</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content small">
            <div class="modal-header">
                <h2>Delete Paste?</h2>
            </div>
            <div class="modal-body">
                <p>This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button id="cancel-delete-btn" class="secondary-btn">Cancel</button>
                <button id="confirm-delete-btn" class="danger-btn">Delete</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=2"></script>
</body>
</html>
