[project]
name = "paste-server"
version = "1.0.0"
description = "Self-hosted paste service with ChatGPT-style interface"
requires-python = ">=3.11"
dependencies = [
    "setuptools>=68.0",
    "flask>=3.0.0",
    "flask-limiter>=3.5.0",
    "flask-cors>=4.0.0",
    "bcrypt>=4.1.2",
    "gunicorn>=21.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
